<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StrivLife</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🌱</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6fb;--card:#ffffff;--text:#1e1b4b;--muted:#6b6f8a;--soft:#f0f0fa;--border:#e8e8f4;--dark:#1e1b4b;--grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);--grad-soft:linear-gradient(135deg,#eef2ff,#f5f3ff);--accent:#6366f1;--ok:#10b981;--shadow:0 1px 2px rgba(30,27,75,.04),0 10px 30px rgba(30,27,75,.06);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--text);font:15px/1.6 "Inter","Sarabun",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{display:flex;justify-content:center}
[hidden]{display:none!important}

/* Phone frame (desktop) */
#app{position:relative;width:100%;height:100dvh;overflow-y:auto;overflow-x:hidden;background:var(--bg);transform:translateZ(0)}
@media (min-width:600px){
  body{align-items:center}
  #app{width:390px;height:844px;max-height:calc(100dvh - 48px);border-radius:48px;border:0;box-shadow:0 30px 60px rgba(30,27,75,.18)}
}

/* Buttons */
button,.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 20px;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(99,102,241,.28);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,opacity .15s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
button.ghost{background:var(--soft);color:var(--text);box-shadow:none}
button.sm{padding:6px 12px;font-size:.8rem;border-radius:12px}
button.danger{background:none;color:#e11d48;box-shadow:none;padding:6px 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* Splash */
#splash{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.gone{opacity:0;visibility:hidden}
.logo{width:88px;height:88px;border-radius:28px;background:var(--grad);display:grid;place-items:center;box-shadow:0 16px 36px rgba(99,102,241,.35);color:#fff;font-weight:900;font-size:2rem}
.splash-name{font-size:2.1rem;font-weight:900;letter-spacing:-.03em}
.splash-tag{color:var(--muted);font-size:.95rem}
.splash-bar{width:140px;height:4px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:28px}
.splash-bar i{display:block;height:100%;width:0;background:var(--grad);animation:load 2.2s ease forwards}
@keyframes load{to{width:100%}}

/* Auth */
#auth{height:100%;display:flex;align-items:stretch;justify-content:center;padding:12px;background:#fff}
.au-card{width:100%;height:100%;border-radius:40px;padding:44px 28px 28px;display:flex;flex-direction:column;overflow-y:auto;background:linear-gradient(160deg,#1e1b4b 0%,#312e81 100%);box-shadow:none;color:#fff}
.au-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.au-brand{font-weight:900;color:#c4b5fd;font-size:1rem;letter-spacing:-.01em}
.au-card h2{margin:14px 0 18px;font-size:1.9rem;font-weight:900;letter-spacing:-.03em}
.au-err{color:#fca5a5;min-height:20px;font-size:.85rem;margin-bottom:6px}
.au-in{display:flex;align-items:center;gap:10px;background:#fff;color:var(--text);border-radius:999px;padding:6px 14px 6px 6px;margin-bottom:12px}
.au-ic{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.au-ic svg{width:20px;height:20px}
.au-in input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font:inherit;font-size:16px;color:var(--text);box-shadow:none;border-radius:0}
.au-in input:focus{outline:none;box-shadow:none;background:transparent;border:0}
.au-in input::placeholder{color:#9b9fb8}
.au-link{background:none;border:0;color:#c4b5fd;font:inherit;font-weight:700;font-size:.82rem;padding:6px 8px;cursor:pointer;box-shadow:none;border-radius:10px;white-space:nowrap}
.au-link:hover{transform:none;box-shadow:none;opacity:.8}
.au-actions{display:flex;justify-content:flex-end;margin:18px 0 6px}
.au-go{width:56px;height:56px;border-radius:50%;padding:0;background:#fff;color:#4338ca;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.14)}
.au-go svg{width:24px;height:24px}
.au-note{text-align:center;color:#a5a3d6;font-size:.85rem;margin:12px 0 0}
.au-or{display:flex;align-items:center;gap:12px;color:#a5a3d6;font-size:.85rem;margin:20px 0 14px}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:#4338ca}
.au-google{width:100%;height:52px;border-radius:999px;background:#fff;color:var(--text);box-shadow:none;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;padding:0}
.au-google:hover{box-shadow:none}
.au-google svg{width:20px;height:20px}
.au-guest{width:100%;background:none;box-shadow:none;color:#c7d2fe;font-weight:700;margin-top:14px;padding:10px}
.au-guest:hover{transform:none;box-shadow:none;color:#fff}
.au-card .au-hint{color:#a5a3d6;font-size:.85rem;margin:-6px 0 12px}

/* Topbar */
body.guest .topbar,body.guest .tabs,body.guest .view{display:none!important}
.topbar{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;background:rgba(246,246,251,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px}
.brand>div:nth-child(2){flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.brand small{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.topbar h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.tb-actions{display:flex;gap:8px}
.icon-btn,.lang-btn{height:44px;border-radius:14px;border:0;background:#fff;color:var(--muted);box-shadow:var(--shadow);display:grid;place-items:center;padding:0 14px;cursor:pointer;font-weight:700;font-size:.8rem}
.icon-btn{width:44px;padding:0;color:var(--text)}
.icon-btn svg{width:22px;height:22px}
.lang-btn:hover,.icon-btn:hover{transform:translateY(-1px);background:#fff}

/* View + cards */
.view{max-width:760px;margin:0 auto;padding:8px 16px 150px;display:grid;gap:14px}
.card{background:var(--card);border-radius:22px;padding:18px;min-width:0;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:.87rem}
.greet{font-size:.92rem;color:var(--muted);margin:6px 2px 0;font-weight:600}
.name{font-size:2rem;font-weight:900;letter-spacing:-.03em;margin:0;line-height:1.15}
.weekcard{background:radial-gradient(120% 120% at 100% 0%,rgba(196,181,253,.45),transparent 55%),linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;border-radius:24px;padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(99,102,241,.3)}
.weekcard .big{font-size:2.6rem;font-weight:900;line-height:1}
.weekcard .lbl{font-size:.85rem;opacity:.85}
.weekcard .go{display:flex;justify-content:space-between;font-size:.85rem;margin-top:10px;font-weight:600}
.bar2{height:6px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.bar2 i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s ease}

/* Checklist */
.addform{display:grid;grid-template-columns:1fr auto;gap:8px}
.addform input,.addform select{width:100%;padding:12px 14px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);color:var(--text);font:inherit;font-size:16px}
.addform input:focus,.addform select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.addform select{grid-column:1/2}
.addform button{grid-row:1/3;grid-column:2}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:10px;padding:0;background:#fff;border:1.5px solid #c7c9e2;color:#fff;box-shadow:none;display:grid;place-items:center;flex:none;font-size:14px}
.chk:hover{transform:none;box-shadow:none}
.task.done .chk{background:var(--grad);border-color:transparent}
.tt{flex:1;min-width:0;font-weight:600;cursor:pointer;word-break:break-word}
.task.done .tt{text-decoration:line-through;color:var(--muted)}

/* Week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.72rem;color:var(--muted)}
.wk b{display:block;font-size:1rem;color:var(--text);margin-top:6px;padding:8px 0;border-radius:14px}
.wk b.sel{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(99,102,241,.3)}

/* History */
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hcell{aspect-ratio:1;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--text)}
.hcell.l1{background:#e0e7ff}
.hcell.l2{background:#a5b4fc}
.hcell.l3{background:var(--grad);color:#fff}
.hcell.today{outline:2px solid var(--dark);outline-offset:1px}

/* Summary */
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--muted);gap:4px}
.bars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:var(--grad);min-height:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--grad-soft);border:1px solid var(--border);border-radius:20px;padding:14px}
.stat b{display:block;font-size:1.5rem;font-weight:900;color:var(--text)}
.stat span{font-size:.8rem;color:var(--muted)}

/* Tab bar + FAB */
.tabs{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));display:flex;align-items:center;gap:12px;z-index:6}
.pill{position:relative;flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-radius:26px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 32px rgba(30,27,75,.14),0 0 0 1px rgba(255,255,255,.6) inset}
.ind{position:absolute;top:16px;left:0;width:50px;height:34px;border-radius:14px;background:var(--grad);box-shadow:0 8px 18px rgba(99,102,241,.35);transition:left .5s cubic-bezier(.34,1.4,.64,1);pointer-events:none;z-index:0}
.tabs .pill button{position:relative;z-index:1;background:none;color:var(--muted);box-shadow:none;font-size:.68rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0;border-radius:18px;min-width:0}
.tabs .pill button:hover{transform:none;box-shadow:none}
.tabs .pill button .ic{width:50px;height:34px;display:grid;place-items:center;transition:color .3s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.tabs .pill button .ic svg{width:22px;height:22px}
.tabs .pill button.on{color:var(--text);font-weight:800}
.tabs .pill button.on .ic{color:#fff;transform:translateY(-1px) scale(1.05)}
.tabs .pill button:active{transform:scale(.92)}
.fab{flex:none;width:58px;height:58px;border-radius:20px;padding:0;background:var(--grad);color:#fff;box-shadow:0 14px 30px rgba(99,102,241,.42);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab:hover{transform:translateY(-2px)}

/* Toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88%;text-align:center;z-index:9}
.toast.show{opacity:1}
/* Bottom nav v2: glass bar, mint capsule for active tab, round dark action button */
.pill{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(30,27,75,.08);box-shadow:0 12px 32px rgba(30,27,75,.14),inset 0 1px 0 rgba(255,255,255,.6)}
.ind{background:#dcfce7;box-shadow:none;border-radius:999px;width:50px;height:34px;top:16px}
.tabs .pill button{transition:transform .15s ease,color .25s ease}
.tabs .pill button:not(.on){color:var(--muted)}
.tabs .pill button.on{color:#14532d;font-weight:800}
.tabs .pill button.on .ic{color:#15803d;transform:none}
.tabs .pill button:active{transform:scale(.92)}
.tabs .pill button:hover .ic svg{animation:navWiggle .5s ease}
@keyframes navWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.tabs{gap:10px}
.fab{width:56px;height:56px;border-radius:50%;background:#1e1b4b;color:#fff;box-shadow:0 10px 24px rgba(30,27,75,.35)}
.fab:hover{background:#1e1b4b;transform:translateY(-2px)}
.fab:active{transform:scale(.92)}
/* Bottom bar slides away when scrolling down and returns when scrolling up */
.tabs{transition:transform .35s ease}
.tabs.hide{transform:translate(-50%,220%)}
/* Slide-to-sign-in control */
.au-actions{display:block;margin:18px 0 6px}
.slider{position:relative;height:60px;width:100%;border-radius:999px;background:#fff;overflow:hidden;padding:4px;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:background .4s ease}
.sl-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,rgba(99,102,241,.06),rgba(139,92,246,.3));transition:opacity .3s}
.sl-text{position:absolute;inset:0;display:grid;place-items:center;padding-left:44px;color:#9b9fb8;font-weight:600;font-size:.95rem;pointer-events:none;white-space:nowrap}
.sl-knob{position:absolute;top:4px;left:4px;width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:grab;box-shadow:0 6px 16px rgba(99,102,241,.4);z-index:2;touch-action:none}
.sl-knob:active{cursor:grabbing}
.sl-knob svg{width:22px;height:22px}
.slider.ok{background:linear-gradient(135deg,#34d399,#10b981)}
.slider.ok .sl-fill{opacity:0}
.slider.ok .sl-knob{background:#fff;color:#10b981;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.slider.ok .sl-text{color:#fff;font-weight:800}
/* Tap animation: floating circle pops up under the active tab, icon bounces */
.ind{top:8px;width:50px;height:50px;border-radius:50%;background:var(--grad);box-shadow:0 10px 22px rgba(99,102,241,.4);transition:left .5s cubic-bezier(.34,1.4,.64,1)}
.ind.bounce{animation:navPop .55s cubic-bezier(.34,1.3,.64,1)}
@keyframes navPop{0%{transform:translateY(0) scale(.85)}35%{transform:translateY(-14px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
.tabs .pill button.on .ic{color:#fff;transform:none}
.tabs .pill button.on .ic svg{animation:iconBounce .5s ease}
@keyframes iconBounce{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.tabs .pill button:active .ic{transform:scale(.85)}
/* Tab panel expands from the tapped tab and merges into the page */
.reveal{position:absolute;border-radius:50%;background:var(--grad);transform:scale(0);z-index:4;pointer-events:none;animation:revealIn .42s cubic-bezier(.6,0,.3,1) forwards;transition:opacity .4s ease}
.reveal.out{opacity:0}
@keyframes revealIn{to{transform:scale(1)}}
.ind{transition:none}
/* Liquid link: a white blob rises from the bar toward the selected tab and merges with it */
.goo{position:absolute;left:-30px;right:-30px;top:-40px;bottom:-30px;pointer-events:none;z-index:0;filter:url(#goo)}
.goo-bar{position:absolute;left:30px;right:30px;top:40px;bottom:30px;border-radius:26px;background:#fff}
.goo-blob{position:absolute;top:17px;width:46px;height:46px;border-radius:50%;background:#fff;transition:left .55s cubic-bezier(.25,.8,.25,1)}
.tabs .pill button{position:relative;z-index:1}
/* Compact tab bar: smaller frame, icons keep their size */
.tabs{width:min(520px,calc(100% - 28px));gap:8px}
.tabs .pill{padding:5px 6px;border-radius:24px}
.tabs .pill button{padding:4px 0 3px;gap:2px}
.ind{top:2px}
/* Icon-only tab bar: labels stay in the DOM for screen readers but are not shown */
.tabs .pill button .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs .pill button{gap:0}
.ind{top:1px}
/* Roomier tab frame so the selected circle sits fully inside */
.tabs .pill{padding:10px 8px;border-radius:30px}
.ind{top:6px}
/* Floating add-item panel opened by the + button */
.sheet-backdrop{position:fixed;inset:0;z-index:20;background:rgba(30,27,75,.35);opacity:0;transition:opacity .3s ease}
.sheet-backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(30,27,75,.2);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-grip{width:44px;height:5px;border-radius:5px;background:#d4d4e4;margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:1.05rem;font-weight:800}
/* Per-day planning, calendar, previews and checklists */
.addform{display:flex;flex-direction:column;gap:10px}
.addform button{grid-row:auto;grid-column:auto;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
.fld input,.fld select,.addform textarea{width:100%;padding:11px 12px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);color:var(--text);font:inherit;font-size:16px}
.addform textarea{resize:none}
.rep{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--text)}
.rep input{width:18px;height:18px;accent-color:#6366f1}
.sheet-go{margin-top:4px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:.72rem;color:var(--muted);font-weight:700;padding:4px 0}
.cal .cd{position:relative;border:0;background:none;box-shadow:none;padding:8px 0;border-radius:12px;color:var(--text);font-weight:700;font-size:.9rem;cursor:pointer}
.cal .cd:hover{transform:none;box-shadow:none;background:var(--soft)}
.cal .cd.blank{visibility:hidden}
.cal .cd.today{outline:2px solid #6366f1;outline-offset:-2px}
.cal .cd.sel{background:var(--grad);color:#fff}
.cal .cd .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#6366f1}
.cal .cd.sel .dot{background:#fff}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pv{min-width:112px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pv-ico{font-size:1.9rem;width:56px;height:56px;border-radius:18px;background:var(--grad-soft);display:grid;place-items:center}
.pv-t{font-weight:700;font-size:.85rem}
.pv-m{font-size:.75rem;color:var(--muted)}
.pv.done{opacity:.5}
.ico{width:34px;height:34px;border-radius:12px;background:var(--grad-soft);display:grid;place-items:center;font-size:1.05rem;flex:none}
.tbody{flex:1;min-width:0}
.task{align-items:flex-start}
.task .chk{margin-top:2px}
.chip{font-size:.65rem;background:var(--soft);color:#6366f1;border-radius:999px;padding:2px 6px;margin-left:4px;font-weight:700}
.tm{font-size:.75rem;color:var(--muted)}
.steps{margin-top:6px;display:grid;gap:4px}
.step{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.step input{width:16px;height:16px;accent-color:#6366f1;flex:none;padding:0;box-shadow:none}
.step.done span{text-decoration:line-through}
.hcell{box-shadow:none;padding:0;transform:none}
.hcell:hover{transform:none;box-shadow:none}
</style>
</head>

<script>
// ===== Config & constants =====
const GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com";
const PERIODS = [["morning","เช้า"],["afternoon","กลางวัน"],["evening","เย็น"]];
const ORDER = {morning:0, afternoon:1, evening:2};
const ICONS = ["📌","📘","✏️","🏃","💧","🧘","🍎","💻","🛌","🎯","🎵","🧹"];
const TITLES = {today:"วันนี้", schedule:"ตารางงาน", history:"ประวัติ", summary:"สรุป", profile:"โปรไฟล์"};
const WEEK = ["จ","อ","พ","พฤ","ศ","ส","อา"];

// templates = items repeated every day; plans = items for one date
const state = {
  lang: "th", user: null, authMode: "login", tab: "today", users: [],
  templates: [], plans: {}, done: {},
  sel: "", month: "", calOpen: false, reminders: false
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function keyOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ return keyOf(new Date()); }
function parseKey(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
function locale(){ return state.lang === "en" ? "en-US" : "th-TH"; }
function dateLabel(k){ return parseKey(k).toLocaleDateString(locale(), {weekday:"long", day:"numeric", month:"long"}); }

// ===== Translation (Thai source text -> English) =====
const EN = {
  "เข้าสู่ระบบ":"Sign in","สร้างบัญชี":"Create account","ยังไม่มีบัญชี?":"No account yet?","สมัครสมาชิก":"Sign up",
  "มีบัญชีอยู่แล้ว?":"Already have an account?","หรือ":"or","ดำเนินการต่อด้วย Google":"Continue with Google",
  "เข้าใช้แบบผู้เยี่ยมชม (ไม่ต้องสมัคร)":"Continue as guest (no sign-up)",
  "การใช้งานนี้เพื่อการวางแผนและติดตามกิจวัตรเท่านั้น":"For planning and tracking daily routines only",
  "ลืมรหัสผ่าน?":"Forgot password?","User ID (หรืออีเมล)":"User ID (or email)",
  "รหัสผ่าน (อย่างน้อย 8 ตัว)":"Password (min. 8 characters)","ยืนยันรหัสผ่าน":"Confirm password","ชื่อที่แสดง":"Display name",
  "เลื่อนเพื่อเข้าสู่ระบบ":"Slide to sign in","เลื่อนเพื่อสมัครสมาชิก":"Slide to sign up","ยินดีต้อนรับ!":"Welcome!",
  "วันนี้":"Today","ตารางงาน":"Schedule","ประวัติ":"History","สรุป":"Summary","โปรไฟล์":"Profile","หน้าหลัก":"Home",
  "วันนี้ทำสำเร็จ":"Completed today","รายการ":"items","ทำต่ออีกนิด ›":"Keep going ›","ยอดเยี่ยม!":"Great job!",
  "เพิ่มรายการ":"Add item","เช่น อ่านหนังสือ 20 นาที":"e.g. Read for 20 minutes",
  "เช้า":"Morning","กลางวัน":"Afternoon","เย็น":"Evening","เพิ่ม":"Add",
  "ยังไม่มีรายการ":"No items yet","ไม่มีรายการ":"No items","ลบ":"Delete","แก้ไขรายการ":"Edit item",
  "ทุกวัน":"Daily","ทำทุกวัน":"Every day","วันที่":"Date","เวลา":"Time","ช่วง":"Period","ไอคอน":"Icon",
  "ขั้นตอนย่อย (บรรทัดละ 1 ข้อ) ไม่บังคับ":"Sub-steps (one per line, optional)",
  "พรุ่งนี้":"Tomorrow","เตรียมไว้ล่วงหน้า":"Prepared in advance","ไม่มีรายการในวันนี้":"Nothing planned",
  "กางปฏิทิน":"Expand calendar","พับปฏิทิน":"Collapse calendar","+ เพิ่มแผน":"+ Add plan",
  "การแจ้งเตือน":"Reminders","เปิดอยู่":"On","ปิดอยู่":"Off",
  "รับการแจ้งเตือนเมื่อถึงเวลาทำกิจวัตร":"Get notified when it's time for your routine",
  "ปิดการแจ้งเตือน":"Turn off reminders","เปิดการแจ้งเตือน":"Turn on reminders",
  "จ":"M","อ":"T","พ":"W","พฤ":"T","ศ":"F","ส":"S","อา":"S",
  "ย้อนหลัง 28 วัน":"Last 28 days","🟩 ครบทั้งหมด":"🟩 Fully done","ครบบางส่วน":"Partially done",
  "วันที่ทำครบทุกรายการ":"Days fully completed","วัน":"days",
  "ความสำเร็จ 7 วันล่าสุด":"Last 7 days","รายการที่ทำสำเร็จทั้งหมด":"Total items completed",
  "เฉลี่ยทุกวันที่บันทึก":"Average on logged days","รายการวันนี้":"Items today",
  "บัญชี":"Account","โหมดผู้เยี่ยมชม":"Guest mode","ออกจากระบบ":"Sign out","ผู้เยี่ยมชม":"Guest",
  "ออกจากระบบแล้ว":"Signed out","สมัครสมาชิกสำเร็จ":"Signed up successfully","เร็ว ๆ นี้":"Coming soon",
  "ยังไม่มีการแจ้งเตือนใหม่":"No new notifications","กรุณาพิมพ์รายการก่อน":"Please type an item first",
  "เพิ่มรายการแล้ว":"Item added","เปิดการแจ้งเตือนแล้ว":"Reminders turned on","ปิดการแจ้งเตือนแล้ว":"Reminders turned off",
  "ฟีเจอร์รีเซ็ตรหัสผ่านจะเปิดใช้เร็ว ๆ นี้":"Password reset is coming soon",
  "ยังไม่ได้ตั้งค่า Google Client ID — เข้าแบบทดสอบแทน":"Google Client ID not set — using demo sign-in",
  "อีเมลหรือรหัสผ่านไม่ถูกต้อง":"Incorrect email or password","กรุณากรอกชื่อที่แสดง":"Please enter a display name",
  "รูปแบบอีเมลไม่ถูกต้อง":"Invalid email format","รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร":"Password must be at least 8 characters",
  "รหัสผ่านไม่ตรงกัน":"Passwords do not match","อีเมลนี้ถูกใช้งานแล้ว":"This email is already in use"
};
function tr(s){ return state.lang === "en" && EN[s] ? EN[s] : s; }
// Walks the app's text nodes and placeholders; keeps the original Thai so it can switch back
function i18n(){
  const root = $("app");
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (n._th === undefined) n._th = n.nodeValue;
    const k = n._th.trim();
    const t = state.lang === "en" && EN[k];
    n.nodeValue = t ? n._th.replace(k, t) : n._th;
  }
  root.querySelectorAll("input,textarea").forEach(el => {
    if (el._ph === undefined) el._ph = el.placeholder;
    el.placeholder = state.lang === "en" && EN[el._ph] ? EN[el._ph] : el._ph;
  });
  const lb = root.querySelector('[data-act="lang"]');
  if (lb) lb.textContent = state.lang === "en" ? "EN" : "TH";
  document.documentElement.lang = state.lang === "en" ? "en" : "th";
}
function toast(msg){
  const t = $("toast"); t.textContent = tr(msg); t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}

// ===== Items & progress =====
function itemsFor(k){
  const t = state.templates.map(x => ({...x, key: "T" + x.id, src: "T"}));
  const p = (state.plans[k] || []).map(x => ({...x, key: "P" + x.id, src: "P"}));
  return [...t, ...p].sort((a, b) => ORDER[a.period] - ORDER[b.period] || (a.time || "99:99").localeCompare(b.time || "99:99"));
}
const isDone = (k, it) => !!state.done[`${k}|${it.key}`];
const stepDone = (k, it, sid) => !!state.done[`${k}|${it.key}|${sid}`];
function dayStat(k){ const its = itemsFor(k); return { total: its.length, done: its.filter(i => isDone(k, i)).length }; }
function pctOf(st){ return st.total ? Math.round(st.done / st.total * 100) : null; }
function findItem(k, key){ return itemsFor(k).find(i => i.key === key); }
function toggleKey(id){ if (state.done[id]) delete state.done[id]; else state.done[id] = true; }

// ===== Shared pieces =====
function taskRow(k, it){
  const dn = isDone(k, it);
  const steps = (it.steps || []).map(s => {
    const sd = stepDone(k, it, s.id);
    return `<label class="step ${sd ? "done" : ""}"><input type="checkbox" data-act="step" data-k="${k}" data-key="${it.key}" data-sid="${s.id}" ${sd ? "checked" : ""}><span>${esc(s.text)}</span></label>`;
  }).join("");
  return `<div class="task ${dn ? "done" : ""}">
    <button class="chk" data-act="toggle" data-k="${k}" data-key="${it.key}" aria-label="ทำเสร็จ">✓</button>
    <span class="ico">${it.icon || "📌"}</span>
    <div class="tbody">
      <div class="tt" data-act="edit" data-k="${k}" data-key="${it.key}">${esc(it.text)}${it.src === "T" ? ' <span class="chip">ทุกวัน</span>' : ""}</div>
      ${it.time ? `<div class="tm">${esc(it.time)}</div>` : ""}
      ${steps ? `<div class="steps">${steps}</div>` : ""}
    </div>
    <button class="danger sm" data-act="del" data-k="${k}" data-key="${it.key}">ลบ</button>
  </div>`;
}
function groupList(k){
  const its = itemsFor(k);
  return PERIODS.map(([p, label]) => {
    const list = its.filter(i => i.period === p);
    return `<section class="card"><h3>${label}<span class="muted">${list.filter(i => isDone(k, i)).length}/${list.length}</span></h3>
      ${list.length ? list.map(i => taskRow(k, i)).join("") : '<p class="muted" style="margin:0">ยังไม่มีรายการ</p>'}</section>`;
  }).join("");
}
function previewRow(k){
  const its = itemsFor(k);
  if (!its.length) return '<p class="muted" style="margin:0">ไม่มีรายการในวันนี้</p>';
  return `<div class="hscroll">${its.map(i => `<div class="pv ${isDone(k, i) ? "done" : ""}"><div class="pv-ico">${i.icon || "📌"}</div><div class="pv-t">${esc(i.text)}</div><div class="pv-m">${esc(i.time || "")}</div></div>`).join("")}</div>`;
}

// ===== Views =====
function vToday(){
  const k = todayKey(), st = dayStat(k), pct = pctOf(st) || 0;
  return `
    <section class="weekcard">
      <div class="lbl">วันนี้ทำสำเร็จ</div>
      <div><div class="big">${st.done} / ${st.total}</div><div class="lbl">รายการ</div><div class="bar2"><i style="width:${pct}%"></i></div></div>
      <div class="go"><span>${pct}%</span><span>${pct >= 100 && st.total ? "ยอดเยี่ยม!" : "ทำต่ออีกนิด ›"}</span></div>
    </section>
    <section class="card"><h3>วันนี้</h3>${previewRow(k)}</section>
    <section class="card"><h3>พรุ่งนี้ <span class="muted">เตรียมไว้ล่วงหน้า</span></h3>${previewRow(addDays(k, 1))}</section>
    ${groupList(k)}`;
}
function dayCell(k, blank){
  if (blank) return '<span class="cd blank"></span>';
  const cls = ["cd"];
  if (k === state.sel) cls.push("sel");
  if (k === todayKey()) cls.push("today");
  const has = dayStat(k).total > 0;
  return `<button class="${cls.join(" ")}" data-act="pick" data-k="${k}">${parseKey(k).getDate()}${has ? '<span class="dot"></span>' : ""}</button>`;
}
function vSchedule(){
  const monthTitle = parseKey(state.month + "-01").toLocaleDateString(locale(), {month:"long", year:"numeric"});
  const head = WEEK.map(w => `<span class="wd">${w}</span>`).join("");
  let cells;
  if (state.calOpen) {
    const first = parseKey(state.month + "-01");
    const offset = (first.getDay() + 6) % 7;
    const n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    cells = [...Array(offset)].map(() => dayCell("", true));
    for (let d = 1; d <= n; d++) cells.push(dayCell(`${state.month}-${pad(d)}`));
  } else {
    const mon = addDays(state.sel, -((parseKey(state.sel).getDay() + 6) % 7));
    cells = [...Array(7)].map((_, i) => dayCell(addDays(mon, i)));
  }
  return `
    <section class="card">
      <div class="cal-head"><button class="sm ghost" data-act="mprev" aria-label="ก่อนหน้า">‹</button><b>${monthTitle}</b><button class="sm ghost" data-act="mnext" aria-label="ถัดไป">›</button></div>
      <div class="cal">${head}${cells.join("")}</div>
      <div class="actions" style="justify-content:center"><button class="ghost sm" data-act="calToggle">${state.calOpen ? "พับปฏิทิน" : "กางปฏิทิน"}</button></div>
    </section>
    <section class="card"><h3>${dateLabel(state.sel)}<button class="sm" data-act="addHere">+ เพิ่มแผน</button></h3></section>
    ${groupList(state.sel)}
    <section class="card"><h3>การแจ้งเตือน<span class="muted">${state.reminders ? "เปิดอยู่" : "ปิดอยู่"}</span></h3>
      <p class="muted" style="margin:0 0 10px">รับการแจ้งเตือนเมื่อถึงเวลาทำกิจวัตร</p>
      <button class="${state.reminders ? "ghost" : ""}" data-act="toggleReminders">${state.reminders ? "ปิดการแจ้งเตือน" : "เปิดการแจ้งเตือน"}</button>
    </section>`;
}
function vHistory(){
  const t = todayKey(), cells = [];
  for (let i = 27; i >= 0; i--) {
    const k = addDays(t, -i), p = pctOf(dayStat(k));
    const lvl = p === null ? "" : p >= 100 ? "l3" : p >= 50 ? "l2" : p > 0 ? "l1" : "";
    cells.push(`<button class="hcell ${lvl} ${i === 0 ? "today" : ""}" data-act="openDay" data-k="${k}">${parseKey(k).getDate()}</button>`);
  }
  let full = 0;
  for (let i = 0; i < 28; i++) { const st = dayStat(addDays(t, -i)); if (st.total && st.done === st.total) full++; }
  return `<section class="card"><h3>ย้อนหลัง 28 วัน</h3><div class="hgrid">${cells.join("")}</div>
    <div class="actions" style="gap:12px;font-size:.8rem;color:var(--muted)"><span>🟩 ครบทั้งหมด</span><span>ครบบางส่วน</span></div></section>
    <section class="card"><h3>วันที่ทำครบทุกรายการ</h3><p style="margin:0;font-size:1.6rem;font-weight:900">${full} <span class="muted" style="font-size:.9rem;font-weight:600">วัน</span></p></section>`;
}
function vSummary(){
  const t = todayKey(), days = [];
  for (let i = 6; i >= 0; i--) {
    const k = addDays(t, -i);
    days.push({ label: parseKey(k).toLocaleDateString(locale(), {weekday:"short"}), p: pctOf(dayStat(k)) || 0 });
  }
  let totalDone = 0, sum = 0, logged = 0;
  for (let i = 0; i < 28; i++) {
    const st = dayStat(addDays(t, -i));
    totalDone += st.done;
    if (st.total) { logged++; sum += pctOf(st); }
  }
  const avg = logged ? Math.round(sum / logged) : 0;
  return `
    <section class="card"><h3>ความสำเร็จ 7 วันล่าสุด</h3>
      <div class="bars">${days.map(d => `<div><i style="height:${Math.max(d.p, 4)}%"></i><span>${d.label}</span></div>`).join("")}</div></section>
    <section class="stats">
      <div class="stat"><b>${pctOf(dayStat(t)) || 0}%</b><span>วันนี้</span></div>
      <div class="stat"><b>${totalDone}</b><span>รายการที่ทำสำเร็จทั้งหมด</span></div>
      <div class="stat"><b>${avg}%</b><span>เฉลี่ยทุกวันที่บันทึก</span></div>
      <div class="stat"><b>${itemsFor(t).length}</b><span>รายการวันนี้</span></div>
    </section>`;
}
function vProfile(){
  const u = state.user;
  return `
    <section class="card" style="display:flex;align-items:center;gap:14px">
      <div class="avatar" style="width:56px;height:56px">${u.picture ? `<img src="${esc(u.picture)}" alt="">` : esc((u.name || "?").charAt(0).toUpperCase())}</div>
      <div style="min-width:0"><b>${esc(u.name)}</b><div class="muted">${u.provider === "anonymous" ? "โหมดผู้เยี่ยมชม" : esc(u.email)}</div></div>
    </section>
    <section class="card"><h3>บัญชี</h3>
      <div class="actions" style="margin-top:0"><button class="ghost" data-act="toggleReminders">${state.reminders ? "ปิดการแจ้งเตือน" : "เปิดการแจ้งเตือน"}</button></div>
      <div class="actions"><button class="danger" data-act="logout">ออกจากระบบ</button></div>
    </section>`;
}
const VIEWS = { today: vToday, schedule: vSchedule, history: vHistory, summary: vSummary, profile: vProfile };

function render(){
  const u = state.user;
  if (!u) return;
  const hr = new Date().getHours();
  $("greet").textContent = hr < 12 ? "Good morning," : hr < 18 ? "Good afternoon," : "Good evening,";
  $("title").textContent = TITLES[state.tab];
  $("avatar").innerHTML = u.picture ? `<img src="${esc(u.picture)}" alt="">` : esc((u.name || "?").charAt(0).toUpperCase());
  document.querySelectorAll(".tabs .pill button[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  const head = state.tab === "today" ? `<div><div class="greet">${$("greet").textContent}</div><div class="name">${esc(u.name)}</div></div>` : "";
  $("view").innerHTML = head + VIEWS[state.tab]();
  moveIndicator();
  i18n();
}

// ===== Add panel =====
function openSheet(){
  $("newDate").value = state.sel;
  $("newRepeat").checked = false;
  const sh = $("sheet"), bg = $("sheetBg");
  sh.hidden = false; bg.hidden = false; i18n();
  requestAnimationFrame(() => { sh.classList.add("open"); bg.classList.add("open"); });
  setTimeout(() => $("newText").focus(), 350);
}
function closeSheet(){
  const sh = $("sheet"), bg = $("sheetBg");
  if (sh.hidden) return;
  sh.classList.remove("open"); bg.classList.remove("open");
  setTimeout(() => { sh.hidden = true; bg.hidden = true; }, 350);
}
function submitAdd(e){
  e.preventDefault();
  const text = $("newText").value.trim();
  if (!text) return toast("กรุณาพิมพ์รายการก่อน");
  const date = $("newDate").value || state.sel;
  const item = {
    id: uid(), text,
    period: $("newPeriod").value, time: $("newTime").value, icon: $("newIcon").value,
    steps: $("newSteps").value.split("\n").map(x => x.trim()).filter(Boolean).map(t => ({id: uid(), text: t}))
  };
  if ($("newRepeat").checked) state.templates.push(item);
  else { if (!state.plans[date]) state.plans[date] = []; state.plans[date].push(item); }
  state.sel = date; state.month = date.slice(0, 7);
  e.target.reset();
  closeSheet(); render(); toast("เพิ่มรายการแล้ว");
}

// ===== Tab bar (liquid indicator) =====
function popNav(){
  const i = document.querySelector(".ind"); if (!i) return;
  i.classList.remove("bounce"); void i.offsetWidth; i.classList.add("bounce");
}
function moveIndicator(){
  const btn = document.querySelector(".tabs .pill button.on");
  if (!btn) return;
  const to = btn.offsetLeft + (btn.offsetWidth - 50) / 2;
  const ind = document.querySelector(".ind"), gb = document.querySelector(".goo-blob");
  if (ind) ind.style.left = to + "px";
  if (gb) {
    const first = !gb._init; gb._init = true;
    if (first) gb.style.transition = "none";
    gb.style.left = (to + 32) + "px";
    if (first) { void gb.offsetWidth; gb.style.transition = ""; }
  }
}

// ===== Auth =====
function renderAuth(){
  const reg = state.authMode === "register";
  $("auTitle").textContent = reg ? "สร้างบัญชี" : "เข้าสู่ระบบ";
  $("auNameWrap").hidden = !reg;
  $("auPass2Wrap").hidden = !reg;
  $("auSwitch").hidden = true;
  $("auRegWrap").innerHTML = reg
    ? `<span>มีบัญชีอยู่แล้ว?</span> <button class="au-link" type="button" data-act="toggleMode">เข้าสู่ระบบ</button>`
    : `<span>ยังไม่มีบัญชี?</span> <button class="au-link" type="button" data-act="toggleMode">สมัครสมาชิก</button>`;
  $("auForgot").hidden = reg;
  $("auErr").textContent = "";
  if (window.resetSlider) window.resetSlider();
  i18n();
}
function setScreen(){
  $("auth").hidden = !!state.user;
  document.body.classList.toggle("guest", !state.user);
}
function login(user){
  state.user = user;
  if (user.provider !== "anonymous" && !state.users.some(u => u.email === user.email)) state.users.push(user);
  state.tab = "today";
  setScreen(); render(); window.scrollTo(0, 0);
  $("app").scrollTop = 0;
}
function logout(){
  if (window.google && GOOGLE_CLIENT_ID.indexOf("YOUR_") !== 0) google.accounts.id.disableAutoSelect();
  state.user = null; state.authMode = "login";
  ["auEmail","auPass","auPass2","auName"].forEach(id => $(id).value = "");
  renderAuth(); setScreen();
  toast("ออกจากระบบแล้ว");
}
function authSubmit(){
  const err = $("auErr"); err.textContent = "";
  const email = $("auEmail").value.trim().toLowerCase();
  const pass = $("auPass").value;
  if (state.authMode === "login") {
    const u = state.users.find(x => x.email === email && x.pass === pass);
    if (!u) return err.textContent = tr("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
    return login({ name: u.name, email: u.email, provider: "email" });
  }
  const name = $("auName").value.trim();
  if (!name) return err.textContent = tr("กรุณากรอกชื่อที่แสดง");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err.textContent = tr("รูปแบบอีเมลไม่ถูกต้อง");
  if (pass.length < 8) return err.textContent = tr("รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร");
  if (pass !== $("auPass2").value) return err.textContent = tr("รหัสผ่านไม่ตรงกัน");
  if (state.users.some(u => u.email === email)) return err.textContent = tr("อีเมลนี้ถูกใช้งานแล้ว");
  state.users.push({ name, email, pass, provider: "email" });
  toast("สมัครสมาชิกสำเร็จ");
  login({ name, email, provider: "email" });
}
function decodeJwt(token){
  const b64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function onGoogleCredential(res){
  const p = decodeJwt(res.credential);
  login({ name: p.name, email: p.email, picture: p.picture, provider: "google" });
}
function googleLogin(){
  if (!window.google || GOOGLE_CLIENT_ID.indexOf("YOUR_") === 0) {
    toast("ยังไม่ได้ตั้งค่า Google Client ID — เข้าแบบทดสอบแทน");
    return login({ name: "Google Demo", email: "demo@gmail.com", provider: "google" });
  }
  google.accounts.id.prompt();
}
function loadGoogle(){
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client"; s.async = true;
  s.onload = () => {
    if (GOOGLE_CLIENT_ID.indexOf("YOUR_") === 0) return;
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
  };
  document.head.appendChild(s);
}

// ===== Slide-to-sign-in =====
(function(){
  const sl = $("slider"), knob = sl.querySelector(".sl-knob"), fill = sl.querySelector(".sl-fill"), txt = $("slText");
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  let startX = 0, pos = 0, dragging = false, done = false;
  const maxPos = () => sl.clientWidth - knob.offsetWidth - 8;
  function setPos(x){
    pos = Math.max(0, Math.min(maxPos(), x));
    knob.style.transform = `translateX(${pos}px)`;
    fill.style.width = (pos + knob.offsetWidth + 4) + "px";
  }
  function setLabel(){
    txt.textContent = tr(state.authMode === "register" ? "เลื่อนเพื่อสมัครสมาชิก" : "เลื่อนเพื่อเข้าสู่ระบบ");
    i18n();
  }
  function reset(){
    done = false; sl.classList.remove("ok"); knob.innerHTML = ARROW;
    setLabel();
    knob.style.transition = "transform .3s ease"; fill.style.transition = "width .3s ease";
    setPos(0);
    setTimeout(() => { knob.style.transition = ""; fill.style.transition = ""; }, 320);
  }
  window.resetSlider = reset;
  knob.addEventListener("pointerdown", e => {
    if (done) return;
    dragging = true; startX = e.clientX - pos;
    knob.setPointerCapture(e.pointerId);
    knob.style.transition = "none"; fill.style.transition = "none";
  });
  knob.addEventListener("pointermove", e => { if (dragging) setPos(e.clientX - startX); });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (pos >= maxPos() * 0.9) {
      done = true; setPos(maxPos());
      sl.classList.add("ok"); knob.innerHTML = CHECK;
      txt.textContent = tr("ยินดีต้อนรับ!"); i18n();
      knob.style.transition = ""; fill.style.transition = "";
      authSubmit();
      setTimeout(() => { if (!state.user) reset(); }, 900);
    } else reset();
  };
  knob.addEventListener("pointerup", end);
  knob.addEventListener("pointercancel", end);
  window.addEventListener("resize", () => setPos(pos));
  knob.innerHTML = ARROW;
  setLabel();
})();

// ===== Bottom bar slides away on scroll down =====
(function(){
  const app = $("app");
  let last = 0;
  app.addEventListener("scroll", () => {
    const y = app.scrollTop;
    if (Math.abs(y - last) < 6 && y > 40) return;
    const hide = y > 40 && y > last;
    document.querySelectorAll(".tabs").forEach(e => e.classList.toggle("hide", hide));
    last = y;
  }, { passive: true });
})();

// ===== Events =====
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn && tabBtn.closest(".tabs")) { state.tab = tabBtn.dataset.tab; popNav(); return render(); }

  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, k = el.dataset.k, key = el.dataset.key;
  switch (act) {
    case "toggleMode": state.authMode = state.authMode === "login" ? "register" : "login"; return renderAuth();
    case "authSubmit": return authSubmit();
    case "googleLogin": return googleLogin();
    case "guestLogin": return login({ name: "ผู้เยี่ยมชม", email: "", provider: "anonymous" });
    case "forgot": return toast("ฟีเจอร์รีเซ็ตรหัสผ่านจะเปิดใช้เร็ว ๆ นี้");
    case "logout": return logout();
    case "lang": state.lang = state.lang === "th" ? "en" : "th"; renderAuth(); if (state.user) render(); return;
    case "bell": return toast("ยังไม่มีการแจ้งเตือนใหม่");
    case "fab": return openSheet();
    case "addHere": return openSheet();
    case "closeSheet": return closeSheet();
    case "toggle": toggleKey(`${k}|${key}`); return render();
    case "step": toggleKey(`${k}|${key}|${el.dataset.sid}`); return render();
    case "del": {
      if (key.charAt(0) === "T") state.templates = state.templates.filter(x => "T" + x.id !== key);
      else state.plans[k] = (state.plans[k] || []).filter(x => "P" + x.id !== key);
      return render();
    }
    case "edit": {
      const it = findItem(k, key); if (!it) return;
      const v = prompt(tr("แก้ไขรายการ"), it.text);
      if (v && v.trim()) {
        const list = it.src === "T" ? state.templates : (state.plans[k] || []);
        const real = list.find(x => (it.src === "T" ? "T" : "P") + x.id === key);
        if (real) real.text = v.trim();
      }
      return render();
    }
    case "pick": state.sel = k; state.month = k.slice(0, 7); return render();
    case "openDay": state.sel = k; state.month = k.slice(0, 7); state.tab = "schedule"; popNav(); return render();
    case "mprev":
    case "mnext": {
      const d = parseKey(state.month + "-01");
      d.setMonth(d.getMonth() + (act === "mnext" ? 1 : -1));
      state.month = keyOf(d).slice(0, 7);
      return render();
    }
    case "calToggle": state.calOpen = !state.calOpen; return render();
    case "toggleReminders": state.reminders = !state.reminders; toast(state.reminders ? "เปิดการแจ้งเตือนแล้ว" : "ปิดการแจ้งเตือนแล้ว"); return render();
  }
});
document.addEventListener("submit", e => { if (e.target.id === "addForm") submitAdd(e); });
window.addEventListener("resize", moveIndicator);

// ===== Start =====
state.sel = todayKey(); state.month = state.sel.slice(0, 7);
loadGoogle();
renderAuth();
setScreen();
setTimeout(() => $("splash").classList.add("gone"), 2200);

</script>
</body>
</html>
