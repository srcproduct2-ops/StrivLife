<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>StrivLife</title>
<meta name="theme-color" content="#6366f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StrivLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='28' fill='url(%23g)'/%3E%3Cg fill='%23fff'%3E%3Crect x='20' y='58' width='16' height='20' rx='8'/%3E%3Crect x='42' y='46' width='16' height='32' rx='8'/%3E%3Crect x='64' y='34' width='16' height='44' rx='8'/%3E%3C/g%3E%3Cpath d='M72 32C67 22 75 12 87 14C89 26 81 34 72 32Z' fill='%2386efac'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Sarabun:wght@400;500;600;700&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6fb;--card:#ffffff;--text:#1e1b4b;--muted:#6b6f8a;--soft:#f0f0fa;--border:#e8e8f4;--dark:#1e1b4b;--grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);--grad-soft:linear-gradient(135deg,#eef2ff,#f5f3ff);--accent:#6366f1;--ok:#10b981;--shadow:0 1px 2px rgba(30,27,75,.04),0 10px 30px rgba(30,27,75,.06);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--text);font:15px/1.6 "Outfit","Sarabun",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{display:flex;justify-content:center}
[hidden]{display:none!important}

/* Phone frame (desktop) */
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:var(--bg);transform:translateZ(0)}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body.guest #scroller{display:none}
@media (min-width:600px){
  body{align-items:center}
  #app{width:390px;height:844px;max-height:calc(100dvh - 48px);border-radius:48px;border:0;box-shadow:0 30px 60px rgba(30,27,75,.18)}
}

/* Buttons */
button,.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 20px;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(99,102,241,.28);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,opacity .15s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
button.ghost{background:var(--soft);color:var(--text);box-shadow:none}
button.sm{padding:6px 12px;font-size:.8rem;border-radius:12px}
button.danger{background:none;color:#e11d48;box-shadow:none;padding:6px 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* Splash */
#splash{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#splash.gone{opacity:0;visibility:hidden}
.logo{width:88px;height:88px;border-radius:28px;background:var(--grad);display:grid;place-items:center;box-shadow:0 16px 36px rgba(99,102,241,.35);color:#fff;font-weight:900;font-size:2rem}
.splash-name{font-size:2.1rem;font-weight:900;letter-spacing:-.03em}
.splash-tag{color:var(--muted);font-size:.95rem}
.splash-bar{width:140px;height:4px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:28px}
.splash-bar i{display:block;height:100%;width:0;background:var(--grad);animation:load 2.2s ease forwards}
@keyframes load{to{width:100%}}

/* Auth */
#auth{height:100%;display:flex;align-items:stretch;justify-content:center;padding:0;background:linear-gradient(160deg,#1e1b4b 0%,#312e81 100%)}
.au-card{width:100%;height:100%;border-radius:0;padding:calc(env(safe-area-inset-top,0px) + 44px) 28px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;overflow-y:auto;background:linear-gradient(160deg,#1e1b4b 0%,#312e81 100%);box-shadow:none;color:#fff}
.au-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.au-brand{font-weight:900;color:#c4b5fd;font-size:1rem;letter-spacing:-.01em}
.au-card h2{margin:14px 0 18px;font-size:1.9rem;font-weight:900;letter-spacing:-.03em}
.au-err{color:#fca5a5;min-height:20px;font-size:.85rem;margin-bottom:6px}
.au-in{display:flex;align-items:center;gap:10px;background:#fff;color:var(--text);border-radius:999px;padding:6px 14px 6px 6px;margin-bottom:12px}
.au-ic{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.au-ic svg{width:20px;height:20px}
.au-in input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font:inherit;font-size:16px;color:var(--text);box-shadow:none;border-radius:0}
.au-in input:focus{outline:none;box-shadow:none;background:transparent;border:0}
.au-in input::placeholder{color:#9b9fb8}
.au-link{background:none;border:0;color:#c4b5fd;font:inherit;font-weight:700;font-size:.82rem;padding:6px 8px;cursor:pointer;box-shadow:none;border-radius:10px;white-space:nowrap}
.au-link:hover{transform:none;box-shadow:none;opacity:.8}
.au-actions{display:flex;justify-content:flex-end;margin:18px 0 6px}
.au-go{width:56px;height:56px;border-radius:50%;padding:0;background:#fff;color:#4338ca;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.14)}
.au-go svg{width:24px;height:24px}
.au-note{text-align:center;color:#a5a3d6;font-size:.85rem;margin:12px 0 0}
.au-or{display:flex;align-items:center;gap:12px;color:#a5a3d6;font-size:.85rem;margin:20px 0 14px}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:#4338ca}
.au-google{width:100%;height:52px;border-radius:999px;background:#fff;color:var(--text);box-shadow:none;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;padding:0}
.au-google:hover{box-shadow:none}
.au-google svg{width:20px;height:20px}
.au-guest{width:100%;background:none;box-shadow:none;color:#c7d2fe;font-weight:700;margin-top:14px;padding:10px}
.au-guest:hover{transform:none;box-shadow:none;color:#fff}
.au-card .au-hint{color:#a5a3d6;font-size:.85rem;margin:-6px 0 12px}

/* Topbar */
body.guest .topbar,body.guest .tabs,body.guest .view{display:none!important}
.topbar{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;background:rgba(246,246,251,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px}
.brand>div:nth-child(2){flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.brand small{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.topbar h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.tb-actions{display:flex;gap:8px}
.icon-btn,.lang-btn{height:44px;border-radius:14px;border:0;background:#fff;color:var(--muted);box-shadow:var(--shadow);display:grid;place-items:center;padding:0 14px;cursor:pointer;font-weight:700;font-size:.8rem}
.icon-btn{width:44px;padding:0;color:var(--text)}
.icon-btn svg{width:22px;height:22px}
.lang-btn:hover,.icon-btn:hover{transform:translateY(-1px);background:#fff}

/* View + cards */
.view{max-width:760px;margin:0 auto;padding:8px 16px 150px;display:grid;gap:14px}
.card{background:var(--card);border-radius:22px;padding:18px;min-width:0;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h3{margin:0 0 12px;font-size:1rem;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:.87rem}
.greet{font-size:.92rem;color:var(--muted);margin:6px 2px 0;font-weight:600}
.name.dt{font-family:"Kanit","Sarabun",sans-serif;font-weight:500;font-size:1.05rem;letter-spacing:.01em}
.name{font-size:1.1rem;font-weight:900;letter-spacing:-.03em;margin:0;line-height:1.15;overflow-wrap:anywhere}
.weekcard{background:radial-gradient(120% 120% at 100% 0%,rgba(196,181,253,.45),transparent 55%),linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;border-radius:24px;padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(99,102,241,.3)}
.weekcard .big{font-size:2.6rem;font-weight:900;line-height:1}
.weekcard .lbl{font-size:.85rem;opacity:.85}
.weekcard .go{display:flex;justify-content:space-between;font-size:.85rem;margin-top:10px;font-weight:600}
.bar2{height:6px;border-radius:6px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}
.bar2 i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .4s ease}

/* Checklist */
.addform{display:grid;grid-template-columns:1fr auto;gap:8px}
.addform input,.addform select{width:100%;padding:12px 14px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);color:var(--text);font:inherit;font-size:16px}
.addform input:focus,.addform select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.addform select{grid-column:1/2}
.addform button{grid-row:1/3;grid-column:2}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:10px;padding:0;background:#fff;border:1.5px solid #c7c9e2;color:#fff;box-shadow:none;display:grid;place-items:center;flex:none;font-size:14px}
.chk:hover{transform:none;box-shadow:none}
.task.done .chk{background:var(--grad);border-color:transparent}
.tt{flex:1;min-width:0;font-weight:600;cursor:pointer;word-break:break-word}
.task.done .tt{text-decoration:line-through;color:var(--muted)}

/* Week strip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.72rem;color:var(--muted)}
.wk b{display:block;font-size:1rem;color:var(--text);margin-top:6px;padding:8px 0;border-radius:14px}
.wk b.sel{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(99,102,241,.3)}

/* History */
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hcell{aspect-ratio:1;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--text)}
.hcell.l1{background:#e0e7ff}
.hcell.l2{background:#a5b4fc}
.hcell.l3{background:var(--grad);color:#fff}
.hcell.today{outline:2px solid var(--dark);outline-offset:1px}

/* Summary */
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.7rem;color:var(--muted);gap:4px}
.bars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:var(--grad);min-height:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--grad-soft);border:1px solid var(--border);border-radius:20px;padding:14px}
.stat b{display:block;font-size:1.5rem;font-weight:900;color:var(--text)}
.stat span{font-size:.8rem;color:var(--muted)}

/* Tab bar + FAB */
.tabs{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));display:flex;align-items:center;gap:12px;z-index:6}
.pill{position:relative;flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-radius:26px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 32px rgba(30,27,75,.14),0 0 0 1px rgba(255,255,255,.6) inset}
.ind{position:absolute;top:16px;left:0;width:50px;height:34px;border-radius:14px;background:var(--grad);box-shadow:0 8px 18px rgba(99,102,241,.35);transition:left .5s cubic-bezier(.34,1.4,.64,1);pointer-events:none;z-index:0}
.tabs .pill button{position:relative;z-index:1;background:none;color:var(--muted);box-shadow:none;font-size:.68rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 0;border-radius:18px;min-width:0}
.tabs .pill button:hover{transform:none;box-shadow:none}
.tabs .pill button .ic{width:50px;height:34px;display:grid;place-items:center;transition:color .3s ease,transform .35s cubic-bezier(.34,1.56,.64,1)}
.tabs .pill button .ic svg{width:22px;height:22px}
.tabs .pill button.on{color:var(--text);font-weight:800}
.tabs .pill button.on .ic{color:#fff;transform:translateY(-1px) scale(1.05)}
.tabs .pill button:active{transform:scale(.92)}
.fab{flex:none;width:58px;height:58px;border-radius:20px;padding:0;background:var(--grad);color:#fff;box-shadow:0 14px 30px rgba(99,102,241,.42);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab:hover{transform:translateY(-2px)}

/* Toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:88%;text-align:center;z-index:9}
.toast.show{opacity:1}
/* Bottom nav v2: glass bar, mint capsule for active tab, round dark action button */
.pill{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(30,27,75,.08);box-shadow:0 12px 32px rgba(30,27,75,.14),inset 0 1px 0 rgba(255,255,255,.6)}
.ind{background:#dcfce7;box-shadow:none;border-radius:999px;width:50px;height:34px;top:16px}
.tabs .pill button{transition:transform .15s ease,color .25s ease}
.tabs .pill button:not(.on){color:var(--muted)}
.tabs .pill button.on{color:#14532d;font-weight:800}
.tabs .pill button.on .ic{color:#15803d;transform:none}
.tabs .pill button:active{transform:scale(.92)}
.tabs .pill button:hover .ic svg{animation:navWiggle .5s ease}
@keyframes navWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.tabs{gap:10px}
.fab{width:56px;height:56px;border-radius:50%;background:#1e1b4b;color:#fff;box-shadow:0 10px 24px rgba(30,27,75,.35)}
.fab:hover{background:#1e1b4b;transform:translateY(-2px)}
.fab:active{transform:scale(.92)}
/* Bottom bar slides away when scrolling down and returns when scrolling up */
.tabs{transition:transform .35s ease}
.tabs.hide{transform:translate(-50%,220%)}
/* Slide-to-sign-in control */
.au-actions{display:block;margin:18px 0 6px}
.slider{position:relative;height:60px;width:100%;border-radius:999px;background:#fff;overflow:hidden;padding:4px;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:background .4s ease}
.sl-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,rgba(99,102,241,.06),rgba(139,92,246,.3));transition:opacity .3s}
.sl-text{position:absolute;inset:0;display:grid;align-items:center;justify-items:start;padding-left:104px;color:#9b9fb8;font-weight:600;font-size:16px;pointer-events:none;white-space:nowrap}
.sl-knob{position:absolute;top:4px;left:4px;width:88px;height:52px;border-radius:999px;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:grab;box-shadow:0 6px 16px rgba(99,102,241,.4);z-index:2;touch-action:none}
.sl-knob:active{cursor:grabbing}
.sl-knob svg{width:22px;height:22px}
.slider.ok{background:linear-gradient(135deg,#34d399,#10b981)}
.slider.ok .sl-fill{opacity:0}
.slider.ok .sl-knob{background:#fff;color:#10b981;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.slider.ok .sl-text{color:#fff;font-weight:800}
/* Tap animation: floating circle pops up under the active tab, icon bounces */
.ind{top:8px;width:50px;height:50px;border-radius:50%;background:var(--grad);box-shadow:0 10px 22px rgba(99,102,241,.4);transition:left .5s cubic-bezier(.34,1.4,.64,1)}
.ind.bounce{animation:navPop .55s cubic-bezier(.34,1.3,.64,1)}
@keyframes navPop{0%{transform:translateY(0) scale(.85)}35%{transform:translateY(-14px) scale(1.12)}100%{transform:translateY(0) scale(1)}}
.tabs .pill button.on .ic{color:#fff;transform:none}
.tabs .pill button.on .ic svg{animation:iconBounce .5s ease}
@keyframes iconBounce{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.tabs .pill button:active .ic{transform:scale(.85)}
/* Tab panel expands from the tapped tab and merges into the page */
.reveal{position:absolute;border-radius:50%;background:var(--grad);transform:scale(0);z-index:4;pointer-events:none;animation:revealIn .42s cubic-bezier(.6,0,.3,1) forwards;transition:opacity .4s ease}
.reveal.out{opacity:0}
@keyframes revealIn{to{transform:scale(1)}}
.ind{transition:none}
/* Liquid link: a white blob rises from the bar toward the selected tab and merges with it */
.goo{position:absolute;left:-30px;right:-30px;top:-40px;bottom:-30px;pointer-events:none;z-index:0;filter:url(#goo)}
.goo-bar{position:absolute;left:30px;right:30px;top:40px;bottom:30px;border-radius:26px;background:#fff}
.goo-blob{position:absolute;top:17px;width:46px;height:46px;border-radius:50%;background:#fff;transition:left .55s cubic-bezier(.25,.8,.25,1)}
.tabs .pill button{position:relative;z-index:1}
/* Compact tab bar: smaller frame, icons keep their size */
.tabs{width:min(520px,calc(100% - 28px));gap:8px}
.tabs .pill{padding:5px 6px;border-radius:24px}
.tabs .pill button{padding:4px 0 3px;gap:2px}
.ind{top:2px}
/* Icon-only tab bar: labels stay in the DOM for screen readers but are not shown */
.tabs .pill button .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs .pill button{gap:0}
.ind{top:1px}
/* Roomier tab frame so the selected circle sits fully inside */
.tabs .pill{padding:10px 8px;border-radius:30px}
.ind{top:6px}
/* Floating add-item panel opened by the + button */
.sheet-backdrop{position:fixed;inset:0;z-index:20;background:rgba(30,27,75,.35);opacity:0;transition:opacity .3s ease}
.sheet-backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(30,27,75,.2);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-grip{width:44px;height:5px;border-radius:5px;background:#d4d4e4;margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:1.05rem;font-weight:800}
/* Per-day planning, calendar, previews and checklists */
.addform{display:flex;flex-direction:column;gap:10px}
.addform button{grid-row:auto;grid-column:auto;width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
.fld input,.fld select,.addform textarea{width:100%;padding:11px 12px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);color:var(--text);font:inherit;font-size:16px}
.addform textarea{resize:none}
.rep{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--text)}
.rep input{width:18px;height:18px;accent-color:#6366f1}
.sheet-go{margin-top:4px}
.foodrows{display:flex;flex-direction:column;gap:8px}
.frw{display:grid;grid-template-columns:minmax(0,1fr) 46px 58px 28px;gap:4px;padding:4px;border-radius:12px;background:var(--soft);align-items:center}
.addform .frw select,.addform .frw input{background:var(--card);padding:6px 8px;border-radius:9px;min-width:0;font-size:13px!important;height:34px}
.addform .frw .fr-qty,.addform .frw .fr-kcal{padding:6px 4px;text-align:center}
.addform .frw .fr-del{width:28px;height:28px;padding:0;border-radius:9px;background:var(--card);color:#ef4444;box-shadow:none;font-size:1rem;line-height:1;display:grid;place-items:center}

/* ---------- Motion ---------- */
.view.enter>*{animation:enterUp .55s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}
.view.enter>*:nth-child(3){animation-delay:.1s}
.view.enter>*:nth-child(4){animation-delay:.15s}
.view.enter>*:nth-child(5){animation-delay:.2s}
.view.enter>*:nth-child(6){animation-delay:.25s}
.view.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes enterUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes logoIn{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.logo{animation:logoIn .8s cubic-bezier(.34,1.56,.64,1) both}
.chk{transition:background .25s ease,border-color .25s ease,transform .2s ease}
.chk.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.card{transition:transform .2s ease,box-shadow .25s ease}
.card:active{transform:scale(.985)}
.pv{transition:transform .2s ease,opacity .3s ease}
.pv:active{transform:scale(.96)}
.cal .cd{transition:transform .15s ease,background .2s ease}
.cal .cd:active{transform:scale(.88)}
.weekcard{transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.bar2 i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.sheet{transition:transform .45s cubic-bezier(.34,1.3,.64,1)}
.sheet-backdrop{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
.tabs{position:absolute!important;left:50%!important;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)!important;top:auto!important;right:auto!important;transform:translate3d(-50%,0,0)!important;will-change:transform;backface-visibility:hidden}

/* ===== Splash logo (minimal, animated) ===== */
.logo{width:96px;height:96px;border-radius:0;background:none;box-shadow:none;display:block;animation:lgFloat 3.2s ease-in-out 1.8s infinite}
.logo svg{display:block;overflow:visible;filter:drop-shadow(0 14px 22px rgba(99,102,241,.32))}
.lg-bg{fill:url(#lgG);transform-box:fill-box;transform-origin:center;animation:lgIn .7s cubic-bezier(.34,1.56,.64,1) both}
.lg-b{fill:#fff;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:lgGrow .55s cubic-bezier(.34,1.4,.64,1) forwards}
.lg-b1{animation-delay:.45s}.lg-b2{animation-delay:.65s}.lg-b3{animation-delay:.85s}
.lg-leaf{fill:#86efac;transform-box:fill-box;transform-origin:0 100%;transform:scale(0) rotate(-20deg);animation:lgLeaf .6s cubic-bezier(.34,1.8,.64,1) 1.35s forwards}

@keyframes lgIn{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}

@keyframes lgLeaf{to{transform:scale(1) rotate(0)}}

/* Pull down from the top to refresh */
.ptr{position:absolute;top:0;left:50%;transform:translate(-50%,-60px);width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 8px 20px rgba(79,70,229,.25);display:grid;place-items:center;z-index:30;transition:transform .3s cubic-bezier(.34,1.3,.64,1);pointer-events:none}

.ptr.spin .ptr-dot{animation:ptrSpin .8s linear infinite}

.pay-hero{background:linear-gradient(135deg,#ecfdf5,#eef2ff);text-align:left}

.pay-sum{display:block;font-size:1.05rem;padding:10px 4px;color:var(--text)}

.pay-row{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-size:.85rem;border-bottom:1px solid var(--border)}
.pay-row:last-child{border-bottom:0}
.pay-row.total{font-weight:800;color:#065f46}
.pay-row b{font-weight:800}

.income-panel{padding:14px 16px;border:0;background:linear-gradient(135deg,#059669 0%,#0d9488 50%,#2563eb 100%);color:#fff;box-shadow:0 14px 30px rgba(13,148,136,.3)}

.inc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.inc-grid>div{display:flex;flex-direction:column;gap:2px;min-width:0}

.inc-grid b{font-size:1.4rem;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.inc-grid small{font-size:.7rem;opacity:.85}

.kindrow{background:var(--soft);border-radius:14px;padding:8px}
.kindrow .fld input{background:var(--card)}
/* Five tabs now: income has its own tab */
.tabs .pill{grid-template-columns:repeat(5,1fr)}
/* Time picker */
.tpick{display:flex;align-items:center;gap:4px}
.tpick select{flex:1;min-width:0;padding:8px 6px;border-radius:12px;border:1.5px solid transparent;background:var(--soft);color:var(--text);font:inherit;font-size:16px;font-variant-numeric:tabular-nums}
.tpick select:focus{outline:none;border-color:#6366f1;background:var(--card)}
.tp-sep,.tp-u{font-weight:800;color:var(--text);font-size:.9rem}

.fr-combo{position:relative;min-width:0}
.fr-combo .fr-search{width:100%;min-width:0;padding:6px 8px;border-radius:9px;background:var(--card);border:1.5px solid transparent;font:inherit;font-size:16px!important;color:var(--text)}

.fr-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 30px rgba(30,27,75,.18);max-height:220px;overflow-y:auto;padding:4px}
.fr-item{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;color:var(--text);box-shadow:none;padding:8px;border-radius:9px;font-size:.85rem;font-weight:600}

.fr-item span{font-size:1rem}
.fr-item small{margin-left:auto;color:var(--muted);font-size:.72rem;font-weight:700}
.fr-item.new{color:#6366f1}

.ic-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.ic-grid .wd{font-size:.7rem;color:var(--muted);font-weight:700;padding:4px 0}
.ic-cell{background:var(--soft);border:0;border-radius:12px;min-height:50px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;color:var(--text);box-shadow:none;font-size:.8rem;cursor:pointer}
.ic-cell:hover{transform:none;box-shadow:none}
.ic-cell b{font-weight:800}
.ic-cell small{font-size:.6rem;font-weight:800;color:#047857;background:#d1fae5;border-radius:6px;padding:1px 3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-cell.blank{visibility:hidden;background:none}
.ic-cell.today{outline:2px solid #6366f1;outline-offset:-2px}
.ic-cell.sel{background:var(--grad);color:#fff}
.ic-cell.sel small{background:rgba(255,255,255,.28);color:#fff}

/* Smaller income summary */

// ===== Time picker: Thai 24-hour style, AM/PM only in English =====
function buildTP(id){
  const box = document.querySelector(`.tpick[data-for="${id}"]`); if (!box) return;
  const v = $(id).value || "", en = state.lang === "en";
  let h = "", m = "", ap = "AM";
  if (v) {
    const [H, M] = v.split(":").map(Number); m = pad(M);
    if (en) { ap = H >= 12 ? "PM" : "AM"; h = String(H % 12 || 12); } else h = pad(H);
  }
  const hours = en ? Array.from({length: 12}, (_, i) => String(i + 1)) : Array.from({length: 24}, (_, i) => pad(i));
  const hOpts = `<option value="">--</option>` + hours.map(x => `<option value="${x}" ${x === h ? "selected" : ""}>${x}</option>`).join("");
  const mOpts = `<option value="">--</option>` + Array.from({length: 60}, (_, i) => pad(i)).map(x => `<option value="${x}" ${x === m ? "selected" : ""}>${x}</option>`).join("");
  const apSel = en ? `<select class="tp-ap" aria-label="AM/PM"><option ${ap === "AM" ? "selected" : ""}>AM</option><option ${ap === "PM" ? "selected" : ""}>PM</option></select>` : "";
  box.innerHTML = `<select class="tp-h" aria-label="ชั่วโมง">${hOpts}</select><span class="tp-sep">${en ? ":" : "."}</span><select class="tp-m" aria-label="นาที">${mOpts}</select>${apSel}${en ? "" : '<span class="tp-u">น.</span>'}`;
}
function buildAllTP(){ document.querySelectorAll(".tpick").forEach(b => buildTP(b.dataset.for)); }
document.addEventListener("change", e => {
  const box = e.target.closest && e.target.closest(".tpick"); if (!box) return;
  const id = box.dataset.for, hSel = box.querySelector(".tp-h"), mSel = box.querySelector(".tp-m"), apSel = box.querySelector(".tp-ap");
  if (!hSel.value) { $(id).value = ""; return; }
  if (!mSel.value) mSel.value = "00";
  let H = Number(hSel.value);
  if (apSel) H = (H % 12) + (apSel.value === "PM" ? 12 : 0);
  $(id).value = `${pad(H)}:${mSel.value}`;
});

function streakInfo(){
  const ks = new Set(Object.keys(state.plans)); Object.keys(state.done).forEach(x => ks.add(x.split("|")[0]));
  let k = [...ks].filter(x => /^\d{4}-\d\d-\d\d$/.test(x)).sort()[0];
  if (!k) return { cur: 0, best: 0 };
  const today = todayKey(); let run = 0, best = 0, n = 0;
  while (k <= today && n++ < 1500) {
    const t = dayStat(k);
    if (t.total > 0 && t.done === t.total) { run++; best = Math.max(best, run); } else if (k !== today) run = 0;
    k = addDays(k, 1);
  }
  return { cur: run, best };
}

function dayIncome(k){
  const w = state.work[k];
  if (!w) return { total: 0, hours: 0, days: 0 };
  const r = calcDay(k, w.start, w.end, w.ot);
  if (!r.hasWork) return { total: 0, hours: 0, days: 0 };
  return { total: r.baseDay + r.extra, hours: w.start && w.end ? (toMin(w.end) - toMin(w.start)) / 60 : (w.ot && w.ot.start && w.ot.end && toMin(w.ot.end) > toMin(w.ot.start) ? (toMin(w.ot.end) - toMin(w.ot.start)) / 60 : 0), days: 1 };
}

// ===== Income: monthly pay + overtime / weekend work =====
function monthlyPay(){ const p = state.pay || {}; return (p.salary || 0) + (p.housing || 0) + (p.position || 0); }
function toMin(t){ const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function calcDay(k, start, end, ot){
  const dailyBase = monthlyPay() / 30, hourly = dailyBase / 8;
  const dow = parseKey(k).getDay(), weekend = dow === 0 || dow === 6;
  const r = { dailyBase, hourly, weekend, baseDay: 0, otH: 0, otPay: 0, wkH: 0, wkPay: 0, extra: 0, hasWork: false };
  const hasTimes = !!(start && end) && toMin(end) > toMin(start);
  const otHours = ot && ot.start && ot.end && toMin(ot.end) > toMin(ot.start) ? (toMin(ot.end) - toMin(ot.start)) / 60 : 0;
  if (!hasTimes && otHours <= 0) return r;
  r.hasWork = true;
  if (!weekend) {
    if (hasTimes) r.baseDay = dailyBase;
    // Mon-Fri: overtime from 18:00 at x1.5 (manual OT hours override the time-based calculation)
    r.otH = otHours > 0 ? otHours : Math.max(0, toMin(end) - Math.max(toMin(start), 18 * 60)) / 60;
    r.otPay = r.otH * hourly * 1.5;
  } else {
    if (hasTimes) {
      // Sat-Sun: before 17:30 x1, from 17:30 x3
      const s = toMin(start), e = toMin(end), cut = 17 * 60 + 30;
      const normal = Math.max(0, Math.min(e, cut) - s), extra = Math.max(0, e - Math.max(s, cut));
      r.wkH += (normal + extra) / 60;
      r.wkPay += normal / 60 * hourly + extra / 60 * hourly * 3;
    }
    if (otHours > 0) { r.wkH += otHours; r.wkPay += otHours * hourly * 3; }
  }
  r.extra = r.otPay + r.wkPay;

function moveIndicator(instant){
  const btn = document.querySelector(".tabs .pill button.on");
  if (!btn || !btn.offsetWidth) return;
  const ind = document.querySelector(".ind"), gb = document.querySelector(".goo-blob");
  const BW = 62, IW = 48, TOP = 11;
  const c = btn.offsetLeft + btn.offsetWidth / 2;          // active tab centre (pill coords)
  if (ind) ind.style.left = (c - IW / 2) + "px";
  if (!gb) return;
  const L1 = c - BW / 2 + 30;                              // .goo starts 30px left of the pill
  if (gb._c === undefined || instant === true) {
    gb._c = c; gb.getAnimations().forEach(a => a.cancel());
    gb.style.left = L1 + "px"; return;
  }
  if (Math.abs(gb._c - c) < 1) return;
  const L0 = parseFloat(getComputedStyle(gb).left);
  gb.getAnimations().forEach(x => x.cancel());
  gb._c = c; gb.style.left = L1 + "px";
  // slide in step with the indicator circle
  gb.animate([{ left: L0 + "px" }, { left: L1 + "px" }], { duration: 600, easing: "cubic-bezier(.34,1.35,.64,1)" });
}

function applyData(d){

  state.pay = d.pay || {salary:30400, housing:2500, position:800}; state.work = d.work || {};
  state.templates = d.templates || [];
  state.customFoods = d.customFoods || []; state.completed = d.completed || {}; state.foodOv = d.foodOv || {}; state.notes = d.notes || {}; state.water = d.water || {}; state.weights = d.weights || {}; state.costGoal = d.costGoal || 0; state.costGoalM = d.costGoalM || 0; state.kcalGoal = d.kcalGoal || 2000;

async function enterFirebase(u){
  state.entering = true;
  try {
    const [data, prof] = await Promise.all([FB.loadData(u.uid), FB.loadProfile(u.uid)]);
    applyData(data);
    const bk = bkRead(u);
    if (bk && bk.ts > ((data && data.clientUpdated) || 0)) {   // local copy is newer than the server's: keep it and push it up
      applyData(bk.data); state.saved = ""; setSync("pending");
    } else setSync("ok");
    if (prof.photo) u.picture = prof.photo;
    login(u);
  } finally { state.entering = false; }
}
// ===== Local backup: written synchronously on every change, so nothing is lost if the app is closed or the
// server write fails / is refused. On sign-in the newer of (server copy, local copy) wins.
const bkKey = u => "strivlife:data:" + ((u && u.uid) || "guest");
function bkWrite(u){

}
function bkRead(u){
  try { const r = JSON.parse(localStorage.getItem(bkKey(u)) || "null"); return r && r.data ? r : null; } catch (e) { return null; }
}
function syncText(){

function scheduleSave(){
  const u = state.user;
  if (!u || snapshot() === state.saved) return;
  bkWrite(u);
  if (!u.uid || !window.FB) { state.saved = snapshot(); return; }   // guest: local only
  setSync("pending");
  clearTimeout(scheduleSave._t);
  scheduleSave._t = setTimeout(flushSave, 400);
}
let saveRetries = 0;
function retrySave(e){
  saveRetries++;
  if (saveRetries === 1) toast(e && e.code === "permission-denied" ? fbError(e) : "บันทึกไม่สำเร็จ กำลังลองใหม่อัตโนมัติ");
  clearTimeout(scheduleSave._t);
  scheduleSave._t = setTimeout(flushSave, Math.min(30000, 2000 * 2 ** saveRetries));
}
async function flushSave(){
  clearTimeout(scheduleSave._t);
  const u = state.user;
  if (!u || !u.uid || !window.FB) return;
  const snap = snapshot();
  if (snap === state.saved) return;
  const p = FB.saveData(u.uid, { ...JSON.parse(snap), clientUpdated: state.localTs || Date.now() });
  // Offline, Firestore keeps the write in its own cache and the promise stays pending until the server
  // confirms. After 4 s treat it as queued; a later rejection triggers the retry path below.
  const out = await new Promise(res => {
    const t = setTimeout(() => res({ k: "queued" }), 4000);
    p.then(() => { clearTimeout(t); res({ k: "ok" }); }, e => { clearTimeout(t); console.error(e); res({ k: "failed", e }); });
  });
  if (out.k === "failed") { setSync("err", out.e && (out.e.code || out.e.name)); return retrySave(out.e); }
  state.saved = snap; saveRetries = 0;
  if (out.k === "ok") setSync("ok");
  else {
    setSync("pending");
    toast("ออฟไลน์: เก็บไว้ในเครื่อง จะซิงก์เมื่อมีเน็ต");
    p.then(() => setSync("ok"), e => { if (state.saved === snap) state.saved = ""; setSync("err", e && (e.code || e.name)); retrySave(e); });
  }
}

function resizeImage(file, size = 256){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const side = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

(function(){
  const sl = $("slider"), knob = sl.querySelector(".sl-knob"), fill = sl.querySelector(".sl-fill"), txt = $("slText");
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  let startX = 0, pos = 0, dragging = false, done = false;
  const maxPos = () => sl.clientWidth - knob.offsetWidth - 8;
  function setPos(x){
    pos = Math.max(0, Math.min(maxPos(), x));
    knob.style.transform = `translateX(${pos}px)`;
    fill.style.width = (pos + knob.offsetWidth + 4) + "px";
  }
  function setLabel(){
    txt.textContent = tr(state.authMode === "register" ? "เลื่อนเพื่อสมัครสมาชิก" : "เลื่อนเพื่อเข้าสู่ระบบ");
    i18n();
  }
  function reset(){
    done = false; sl.classList.remove("ok"); knob.innerHTML = ARROW;
    setLabel();
    knob.style.transition = "transform .3s ease"; fill.style.transition = "width .3s ease";
    setPos(0);
    setTimeout(() => { knob.style.transition = ""; fill.style.transition = ""; }, 320);
  }
  window.resetSlider = reset;
  knob.addEventListener("pointerdown", e => {
    if (done) return;
    dragging = true; startX = e.clientX - pos;
    knob.setPointerCapture(e.pointerId);
    knob.style.transition = "none"; fill.style.transition = "none";
  });
  knob.addEventListener("pointermove", e => { if (dragging) setPos(e.clientX - startX); });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (pos >= maxPos() * 0.9) {
      const idEl = $("auEmail"), pwEl = $("auPass");
      if (!idEl.value.trim() || !pwEl.value) {   // slid without filling in the credentials
        $("auErr").textContent = tr("โปรดใส่ username และ password");
        reset(); (idEl.value.trim() ? pwEl : idEl).focus();
        return;
      }
      done = true; setPos(maxPos());
      sl.classList.add("ok"); knob.innerHTML = CHECK;
      txt.textContent = tr("ยินดีต้อนรับ!"); i18n();
      knob.style.transition = ""; fill.style.transition = "";
      Promise.resolve(authSubmit()).then(() => setTimeout(() => { if (!state.user) reset(); }, 900));
    } else reset();
  };
  knob.addEventListener("pointerup", end);
  knob.addEventListener("pointercancel", end);
  window.addEventListener("resize", () => setPos(pos));
  knob.innerHTML = ARROW;
  setLabel();
})();

const TAB_ORDER = ["today","schedule","summary","income","profile"];
function switchTab(next){
  if (next === state.tab) return;
  const dir = TAB_ORDER.indexOf(next) > TAB_ORDER.indexOf(state.tab) ? 1 : -1;
  popNav();
  const out = $("view").animate(
    [{opacity:1, transform:"translateX(0)"}, {opacity:0, transform:`translateX(${-dir * 28}px)`}],
    {duration:170, easing:"ease-in", fill:"forwards"});
  out.finished.then(() => {
    state.tab = next;
    render();
    out.cancel();
    const v = $("view");
    v.animate(
      [{opacity:0, transform:`translateX(${dir * 28}px)`}, {opacity:1, transform:"translateX(0)"}],
      {duration:340, easing:"cubic-bezier(.2,.8,.2,1)"});
    v.classList.add("enter");
    setTimeout(() => v.classList.remove("enter"), 1000);
  });
}

  if (id === "dayNote") { const v = e.target.value; if (v.trim()) state.notes[todayKey()] = v; else delete state.notes[todayKey()]; scheduleSave(); return; }
  if (id === "fmq") { state.fmq = e.target.value; $("fmList").innerHTML = fmListHTML(); return; }
  const c = e.target.classList; if (!c) return;
  if (c.contains("fr-qty")) onQtyInput(e.target);
  else if (c.contains("fr-kcal")) updateFoodTotal();
});

// ===== Lock zoom (pinch, double-tap, ctrl+wheel) =====
["gesturestart","gesturechange","gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault(); });
let _lastTouchEnd = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - _lastTouchEnd < 300) e.preventDefault(); _lastTouchEnd = now; }, {passive:false});

// ===== Pull down to refresh =====
function syncNow(){
  const u = state.user;
  if (!u || !u.uid || !window.FB || !window.FB.loadData || snapshot() !== state.saved) return Promise.resolve();
  return window.FB.loadData(u.uid).then(d => {
    if (!d || snapshot() !== state.saved) return;
    applyData(d);
    state.saved = snapshot();
  }).catch(e => console.warn("sync", e));
}
(function(){
  const app = $("app"), ptr = $("ptr");
  let y0 = null, pull = 0, busy = false;
  app.addEventListener("touchstart", e => {
    y0 = (app.scrollTop <= 0 && !busy) ? e.touches[0].clientY : null;
    pull = 0;
  }, {passive: true});
  app.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy <= 0) { pull = 0; ptr.classList.remove("show", "ready"); ptr.style.transform = ""; return; }
    pull = Math.min(dy * 0.5, 90);
    ptr.style.transform = `translate(-50%, ${pull - 60}px)`;
    ptr.classList.toggle("ready", pull >= 50);
  }, {passive: true});
  app.addEventListener("touchend", () => {
    if (y0 === null) return;
    y0 = null;
    ptr.style.transform = "";
    ptr.classList.remove("ready");
    if (pull >= 50) refresh(); else ptr.classList.remove("show");
    pull = 0;
  }, {passive: true});
  function refresh(){
    busy = true;
    ptr.classList.add("show", "spin");
    const done = () => { ptr.classList.remove("show", "spin"); busy = false; };
    Promise.all([refreshFoods(), syncNow()])
      .then(() => { if (state.user) render(); })
      .finally(() => setTimeout(done, 400));
  }
})();

// ===== Start =====
state.today = todayKey();
// When the app comes back to the foreground: move to the new day, refresh foods, and pull the latest saved data
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !state.user) return;
  const k = todayKey();
  if (state.today !== k) {
    if (state.sel === state.today) state.sel = k;
    state.today = k;
    state.month = state.sel.slice(0, 7);
  }
  render();
  refreshFoods();
  const u = state.user;
  if (u.uid && window.FB && window.FB.loadData && snapshot() === state.saved) {
    window.FB.loadData(u.uid).then(d => {
      if (!d || snapshot() !== state.saved) return;   // keep unsaved local changes
      applyData(d);
      state.saved = snapshot();
      render();
    }).catch(e => console.warn("resume sync", e));
  }
});
function applyTheme(){
  document.documentElement.dataset.theme = state.theme;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = state.theme === "dark" ? "#0f0e1a" : "#f7f6ff";
}
state.theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
applyTheme();
function dateNow(){
  const d = parseKey(todayKey());
  if (state.lang !== "en") return dateLabel(todayKey());   // Thai: วันเสาร์ที่ 24 ตุลาคม
  return `${d.toLocaleDateString("en-US", {weekday:"long"})}, ${d.getDate()} ${d.toLocaleDateString("en-US", {month:"long"})}`;
}
function timeNow(){ return new Date().toLocaleTimeString(locale(), {hour:"2-digit", minute:"2-digit", second:"2-digit"}); }
setInterval(() => { if (state.user && $("greet")) $("greet").textContent = timeNow(); }, 1000);
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredInstall = e;
  if (state.user && state.tab === "profile") render();
});
window.addEventListener("appinstalled", () => {
  deferredInstall = null; toast("ติดตั้งแอปแล้ว");
  if (state.user && state.tab === "profile") render();
});
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW", err)));
}
state.sel = todayKey(); state.month = state.sel.slice(0, 7);
renderAuth();
setScreen();
setTimeout(() => $("splash").classList.add("gone"), 2200);

</script>

  const VAPID_KEY = "BHXxRZ8gjoPbQ9ItlYMVaYD5yHeTd4ohQd9aMOSu96btUTJzD34cc5sWINpuEeggAU7oXb-V7NrtM6C8YFyHWPY";

  let db;

  } catch (e) { console.warn("Offline cache unavailable", e); db = getFirestore(app); }

  const DOMAIN = "@users.strivlife.app";

  const shownEmail = e => (e || "").endsWith(DOMAIN) ? e.slice(0, -DOMAIN.length) : (e || "");
  const info = (u, name) => ({
    uid: u.uid,
    name: name || u.displayName || shownEmail(u.email).split("@")[0] || "User",

      await setDoc(doc(db, "users", cred.user.uid), {
        name: cred.user.displayName || "", email: cred.user.email || "", lastLogin: serverTimestamp()
      }, { merge: true });
      return info(cred.user);
    }),
    loadProfile: async uid => {
      const snap = await getDoc(doc(db, "users", uid));

    },
    updatePhoto: (uid, photo) => setDoc(doc(db, "users", uid), { photo }, { merge: true }),
    updateName: async (uid, name) => {
      await updateProfile(auth.currentUser, { displayName: name });
      await setDoc(doc(db, "users", uid), { name }, { merge: true });
    },
    resetPassword: email => sendPasswordResetEmail(auth, email),
    signOut: () => signOut(auth),
    async loadData(uid) {
      const snap = await getDoc(dataRef(uid));
      return snap.exists() ? snap.data() : {};
    },
    enablePush: async uid => {
      if (VAPID_KEY.indexOf("PASTE") === 0) throw new Error("no-vapid");
      if (!(await msgSupported())) throw new Error("unsupported");
      if (Notification.permission !== "granted" && (await Notification.requestPermission()) !== "granted") throw new Error("denied");

      const token = await getToken(getMessaging(app), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
      await setDoc(doc(db, "users", uid, "tokens", token), { at: serverTimestamp(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Bangkok" });
      return token;
    },
    saveData: (uid, data) => setDoc(dataRef(uid), { ...data, updatedAt: serverTimestamp() }),
    addFood: food => setDoc(doc(collection(db, "foods"), food.id), food),
    loadFoods: async () => (await getDocs(collection(db, "foods"))).docs.map(d => d.data())
  };

  // Restore the session after a page reload
  onAuthStateChanged(auth, u => {
    if (busy || !u) return;
    window.dispatchEvent(new CustomEvent("fb-session", { detail: info(u) }));
  });

        { src: ICON_512, sizes: "512x512", type: "image/png", purpose: "any" },
        { src: ICON_MASK, sizes: "512x512", type: "image/png", purpose: "maskable" }
      ]
    };
    var l = document.createElement("link");
    l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
    document.head.appendChild(l);
  } catch (e) { console.warn("manifest", e); }
})();
</script>
